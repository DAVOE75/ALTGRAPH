<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1080px;
            background-color: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .canvas {
            width: 1080px;
            height: 1080px;
            background-color: #0b0e14;
            position: relative;
        }

        /* The full-bleed background image with a diagonal/bottom fade */
        .bg-image {
            position: absolute;
            left: 0;
            top: 0;
            width: 1080px;
            height: 1080px;
            object-fit: cover;
            -webkit-mask-image: linear-gradient(190deg, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
            mask-image: linear-gradient(190deg, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
            opacity: 0.9;
        }

        /* Abstract blobs to give it life */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(100,255,218,0.15) 0%, rgba(11,14,20,0) 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
        }

        .text-container {
            position: absolute;
            bottom: 80px;
            left: 80px;
            width: 920px;
            z-index: 10;
        }

        .title {
            font-size: 96px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: -3px;
            background-color: rgba(11, 14, 20, 0.7);
            padding: 10px 20px;
            display: inline-block;
            border-radius: 8px;
        }

        .subtitle {
            font-size: 38px;
            font-weight: 500;
            color: #64ffda; /* Cyan accent */
            margin: 20px 0 0 0;
            line-height: 1.3;
            letter-spacing: -0.5px;
            background-color: rgba(11, 14, 20, 0.7);
            padding: 10px 20px;
            display: inline-block;
            border-radius: 8px;
        }

        /* Icons Container */
        .icons-top {
            position: absolute;
            top: 80px;
            right: 80px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .icon {
            width: 64px;
            height: 64px;
            fill: #a3b3c4;
            opacity: 0.9;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }

        .feature-list {
            position: absolute;
            top: 80px;
            left: 80px;
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .feature-item {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            background-color: rgba(11, 14, 20, 0.8);
            padding: 10px 20px;
            border-radius: 8px;
            border-left: 4px solid #64ffda;
        }

    </style>
</head>
